      <rect x="25" y="46" width="7" height="26" rx="3.5"/>
      <rect x="39" y="36" width="7" height="46" rx="3.5"/>
      <rect x="53" y="26" width="7" height="66" rx="3.5"/>
      <rect x="67" y="38" width="7" height="42" rx="3.5"/>
      <rect x="81" y="48" width="7" height="22" rx="3.5"/>
    </g>
    <circle cx="89" cy="88" r="6.5" fill="#fff"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
