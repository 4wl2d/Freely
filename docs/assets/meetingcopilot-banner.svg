      <stop stop-color="#091c29"/>
      <stop offset="1" stop-color="#153c42"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#2ee0c9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2ee0c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <ellipse cx="1030" cy="220" rx="330" ry="250" fill="url(#glow)"/>
  <path d="M800 274h44m14 0h30m14 0h58m14 0h38m14 0h78" fill="none" stroke="#69bcb3" stroke-opacity=".24" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(64 100)">
