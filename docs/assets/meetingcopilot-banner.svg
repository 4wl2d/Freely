    <text x="216" y="162" fill="#f3fbfa" font-size="58" font-weight="650" letter-spacing="-1.9">MeetingCopilot</text>
    <text x="220" y="202" fill="#b8d0d1" font-size="23">Local transcription. Native meeting assistance.</text>
    <text x="220" y="249" fill="#8cbbb9" font-size="14" letter-spacing=".5">macOS 15+  /  Apple Silicon  /  Swift 6</text>
